
name: TML Test Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - feature/TML-1-automated-deployment

permissions:
  contents: read

jobs:
  verify-test-ssm:
    name: Verify Test EC2 SSM Connection
    runs-on: ubuntu-latest
    environment: testing

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TEST_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Execute harmless SSM test
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0737b37920b8b9362"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "TML GitHub Actions test environment verification" \
            --parameters '{"commands":["whoami","hostname","pwd"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json


      - name: Dry-run backend release activation
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0737b37920b8b9362"
          RELEASE_SHA="1111111111111111111111111111111111111111"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "TML test backend activation dry run" \
            --parameters "{\"commands\":[\"runuser -u ec2-user -- bash -c '/home/ec2-user/activate-backend-test.sh $RELEASE_SHA --dry-run'\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
