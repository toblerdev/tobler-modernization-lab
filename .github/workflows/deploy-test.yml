
name: TML Test Deployment

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: '40-character Git commit SHA of the published test artifact'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tml-test-deployment
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Test Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout authorized feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate branch and release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          EXPECTED_REF="refs/heads/feature/TML-1-automated-deployment"

          if [[ "$GIT_REF" != "$EXPECTED_REF" ]]; then
            echo "ERROR: Workflow must run from the authorized feature branch."
            exit 1
          fi

          echo "Release SHA length: ${#RELEASE_SHA}"
          printf 'Release SHA shell representation: %q\n' "$RELEASE_SHA"

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid release SHA."
            exit 1
          fi

          if ! git cat-file -e "$RELEASE_SHA^{commit}"; then
            echo "ERROR: Release SHA is not a valid repository commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$RELEASE_SHA" HEAD; then
            echo "ERROR: Release commit is not in authorized branch history."
            exit 1
          fi

          echo "Release validated: $RELEASE_SHA"

  stage-test-backend:
    name: Stage and Verify Test Backend
    needs: validate-release
    runs-on: ubuntu-latest
    environment: testing

    permissions:
      id-token: write
      contents: read

    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      INSTANCE_ID: i-0737b37920b8b9362
      BUCKET: tml-deployment-artifacts-779400169960-us-east-2-an
      AWS_REGION: us-east-2

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TEST_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify release artifacts exist in S3
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="releases/$RELEASE_SHA"

          aws s3api head-object \
            --bucket "$BUCKET" \
            --key "$PREFIX/release.tar.gz" \
            --query 'ContentLength' \
            --output text

          aws s3api head-object \
            --bucket "$BUCKET" \
            --key "$PREFIX/release.tar.gz.sha256" \
            --query 'ContentLength' \
            --output text

          echo "Release artifacts found in S3."

      - name: Stage release and perform activation dry run
        shell: bash
        run: |
          set -euo pipefail

          cat > remote-stage.sh <<'REMOTE'
          set -euo pipefail

          SHA="__RELEASE_SHA__"
          RELEASE_DIR="/home/ec2-user/tml-releases/releases/$SHA"
          CONFIG="/home/ec2-user/tml-config/backend.env"

          if [[ -e "$RELEASE_DIR" || -L "$RELEASE_DIR" ]]; then
            echo "Release already staged; checking prerequisites."

            test -d "$RELEASE_DIR"
            test -f "$RELEASE_DIR/backend/dist/main.js"
            test -f "$RELEASE_DIR/frontend/dist/index.html"
            test -d "$RELEASE_DIR/backend/node_modules"
            test -L "$RELEASE_DIR/backend/.env"
            test "$(readlink -f "$RELEASE_DIR/backend/.env")" = "$CONFIG"

            echo "Existing release prerequisites verified."
          else
            /home/ec2-user/deploy.sh "$SHA"
          fi

          /home/ec2-user/activate-backend-test.sh "$SHA" --dry-run
          REMOTE

          sed -i "s/__RELEASE_SHA__/$RELEASE_SHA/g" remote-stage.sh

          ENCODED_SCRIPT=$(base64 -w 0 < remote-stage.sh)

          python3 - "$ENCODED_SCRIPT" > ssm-parameters.json <<'PY'
          import json
          import sys

          encoded = sys.argv[1]

          command = (
              "runuser -u ec2-user -- bash -c "
              "'base64 -d | bash' <<'EOF'\n"
              + encoded +
              "\nEOF"
          )

          print(json.dumps({"commands": [command]}))
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "TML stage and dry-run test backend" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "SSM waiter reported an unsuccessful or incomplete command."
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          RESPONSE_CODE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'ResponseCode' \
            --output text)

          if [[ "$RESPONSE_CODE" != "0" ]]; then
            echo "ERROR: Staging or dry run failed."
            exit 1
          fi

          echo "Test release staged and dry run passed."

  activate-test-backend:
    name: Approve and Activate Test Backend
    needs: stage-test-backend
    runs-on: ubuntu-latest
    environment: testing-activation

    permissions:
      id-token: write
      contents: read

    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      INSTANCE_ID: i-0737b37920b8b9362

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TEST_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Activate and verify test backend
        shell: bash
        run: |
          set -euo pipefail

          cat > remote-activate.sh <<'REMOTE'
          set -euo pipefail

          export PATH="/home/ec2-user/.nvm/versions/node/v22.23.3/bin:$PATH"

          SHA="__RELEASE_SHA__"

          TML_APPROVED_DEPLOYMENT=YES \
            /home/ec2-user/activate-backend-test.sh "$SHA" --activate

          EXPECTED="/home/ec2-user/tml-releases/releases/$SHA"

          ACTUAL=$(readlink -f /home/ec2-user/tml-releases/current)

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ERROR: Active release pointer mismatch."
            exit 1
          fi

          pm2 describe tml-backend

          node -e '
            const http = require("node:http");
            const url = "http://127.0.0.1:3000/crm/companies";

            http.get(url, (res) => {
              let body = "";
              res.on("data", chunk => body += chunk);
              res.on("end", () => {
                if (res.statusCode !== 200) {
                  console.error("Unexpected HTTP status:", res.statusCode);
                  process.exit(1);
                }

                try {
                  const companies = JSON.parse(body);
                  if (!Array.isArray(companies)) {
                    throw new Error("Expected companies array");
                  }
                  console.log("CRM API verification passed.");
                } catch (error) {
                  console.error(error.message);
                  process.exit(1);
                }
              });
            }).on("error", error => {
              console.error(error.message);
              process.exit(1);
            });
          '

          echo "Test backend activation verified: $SHA"
          REMOTE

          sed -i "s/__RELEASE_SHA__/$RELEASE_SHA/g" remote-activate.sh

          ENCODED_SCRIPT=$(base64 -w 0 < remote-activate.sh)

          python3 - "$ENCODED_SCRIPT" > ssm-parameters.json <<'PY'
          import json
          import sys

          encoded = sys.argv[1]

          command = (
              "runuser -u ec2-user -- bash -c "
              "'base64 -d | bash' <<'EOF'\n"
              + encoded +
              "\nEOF"
          )

          print(json.dumps({"commands": [command]}))
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "TML approved test backend activation" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "SSM waiter reported an unsuccessful or incomplete command."
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          RESPONSE_CODE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'ResponseCode' \
            --output text)

          if [[ "$RESPONSE_CODE" != "0" ]]; then
            echo "ERROR: Test backend activation or verification failed."
            exit 1
          fi

          echo "Approved test deployment completed successfully."
