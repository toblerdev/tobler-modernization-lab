name: TML Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tml-production-deployment
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and Package Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up backend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build and test backend
        working-directory: backend
        run: |
          npm ci
          npm test -- --runInBand
          npm run build

      - name: Prepare backend runtime dependencies
        working-directory: backend
        run: npm prune --omit=dev

      - name: Set up frontend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/backend release/frontend
          cp -a backend/dist release/backend/
          cp -a backend/node_modules release/backend/
          cp -a frontend/dist release/frontend/

          find release/backend/node_modules \
            -type d -name .bin -prune -exec rm -rf -- {} +

          if find release -type l -print -quit | grep -q .; then
            echo "ERROR: Release contains unexpected symlinks." >&2
            exit 1
          fi

          test -f release/backend/dist/main.js
          test -f release/frontend/dist/index.html
          test -d release/backend/node_modules

          tar -czf release.tar.gz -C release .
          sha256sum release.tar.gz > release.tar.gz.sha256
          echo "Release commit: $GITHUB_SHA"
          du -h release.tar.gz

      - name: Save release artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: |
            release.tar.gz
            release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  stage-production:
    name: Stage Production Release
    needs: build-and-upload
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: production-release

      - name: Verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check release.tar.gz.sha256

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Upload or verify immutable release artifacts
        shell: bash
        env:
          BUCKET: tml-deployment-artifacts-779400169960-us-east-2-an
        run: |
          set -euo pipefail
          PREFIX="releases/$GITHUB_SHA"

          # First inspect both objects. A missing object returns 404;
          # permission errors and other failures must stop the job.
          declare -A EXISTS
          for FILE in release.tar.gz release.tar.gz.sha256; do
            KEY="$PREFIX/$FILE"
            ERR_FILE=$(mktemp)
            if aws s3api head-object --bucket "$BUCKET" --key "$KEY" \
              >/dev/null 2>"$ERR_FILE"; then
              EXISTS["$FILE"]=yes
            elif grep -Eq '\(404\)|Not Found' "$ERR_FILE"; then
              EXISTS["$FILE"]=no
            else
              echo "ERROR: Unable to inspect S3 object $KEY" >&2
              cat "$ERR_FILE" >&2
              rm -f "$ERR_FILE"
              exit 1
            fi
            rm -f "$ERR_FILE"
          done

          # Never repair a partially populated immutable release prefix.
          if [[ "${EXISTS[release.tar.gz]}" != "${EXISTS[release.tar.gz.sha256]}" ]]; then
            echo "ERROR: Incomplete release prefix; manual review required." >&2
            exit 1
          fi

          if [[ "${EXISTS[release.tar.gz]}" == yes ]]; then
            for FILE in release.tar.gz release.tar.gz.sha256; do
              KEY="$PREFIX/$FILE"
              TEMP_FILE=$(mktemp)
              aws s3api get-object --bucket "$BUCKET" --key "$KEY" \
                "$TEMP_FILE" >/dev/null
              if ! cmp -s "$FILE" "$TEMP_FILE"; then
                echo "ERROR: Existing artifact differs: $KEY" >&2
                rm -f "$TEMP_FILE"
                exit 1
              fi
              rm -f "$TEMP_FILE"
              echo "Verified existing immutable artifact: $KEY"
            done
          else
            for FILE in release.tar.gz release.tar.gz.sha256; do
              KEY="$PREFIX/$FILE"
              aws s3api put-object \
                --bucket "$BUCKET" \
                --key "$KEY" \
                --body "$FILE" \
                --if-none-match '*'
              echo "Uploaded immutable artifact: $KEY"
            done
          fi

      - name: Stage release and run dry-run validation
        shell: bash
        env:
          INSTANCE_ID: i-09f60feed6b513d99
        run: |
          set -euo pipefail
          RELEASE_SHA="$GITHUB_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          PARAMS=$(python3 - "$RELEASE_SHA" <<'PY'
          import json
          import sys

          sha = sys.argv[1]
          commands = [
              "set -e",
              f"runuser -u ec2-user -- /home/ec2-user/deploy.sh '{sha}'",
              f"runuser -u ec2-user -- /home/ec2-user/activate-backend.sh '{sha}' --dry-run",
          ]
          print(json.dumps({"commands": commands}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --comment "TML production staging and activation dry-run" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status --output text)

          if [[ "$STATUS" != Success ]]; then
            echo "ERROR: Production staging failed: $STATUS" >&2
            exit 1
          fi
          echo "Production staging and activation dry-run passed."

  activate-production:
    name: Activate Production Release
    needs: stage-production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Production activation remains disabled
        shell: bash
        run: |
          echo "Production approval granted."
          echo "Staging and dry-run validation completed."
          echo "Actual production activation is NOT enabled."
          echo "No PM2 restart or active release switch will be performed."
