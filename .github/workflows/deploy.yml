
name: TML Production Deployment

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Full 40-character commit SHA approved for release"
        required: true
        type: string
      deployment_mode:
        description: "Stage, activate, or verify a production release"
        required: true
        type: choice
        options:
          - stage
          - activate
          - verify
        default: stage

permissions:
  contents: read

concurrency:
  group: tml-production-deployment
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and package release
    if: ${{ github.ref == 'refs/heads/main' && inputs.deployment_mode == 'stage' }}
    runs-on: ubuntu-latest

    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}

    steps:
      - name: Validate approved commit SHA
        id: validate
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: approved_sha must be a lowercase 40-character SHA."
            exit 1
          fi

          if [[ "$APPROVED_SHA" != "$RELEASE_SHA" ]]; then
            echo "ERROR: Approved SHA does not match the workflow commit."
            exit 1
          fi

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out approved source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up backend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Remove backend development dependencies
        working-directory: backend
        run: npm prune --omit=dev

      - name: Set up frontend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package release and generate checksum
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p release-package/backend
          mkdir -p release-package/frontend

          cp -a backend/dist release-package/backend/
          cp -a backend/node_modules release-package/backend/
          cp backend/package.json release-package/backend/
          cp backend/package-lock.json release-package/backend/

          cp -a frontend/dist release-package/frontend/

          tar -czf "${RELEASE_SHA}.tar.gz" \
            --exclude='*/node_modules/.bin' \
            --exclude='*/node_modules/.bin/*' \
            -C release-package .

          # EC2 expects the checksum filename to be release.tar.gz.
          cp "${RELEASE_SHA}.tar.gz" release.tar.gz

          sha256sum release.tar.gz \
            > "${RELEASE_SHA}.tar.gz.sha256"

          sha256sum -c "${RELEASE_SHA}.tar.gz.sha256"

          rm release.tar.gz

      - name: Validate release archive entries
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - "$RELEASE_SHA.tar.gz" <<'PY'
          import sys
          import tarfile

          archive = sys.argv[1]

          allowed_prefixes = (
              "backend/dist/",
              "backend/node_modules/",
              "frontend/dist/",
          )

          allowed_paths = {
              "backend",
              "frontend",
              "backend/dist",
              "backend/node_modules",
              "frontend/dist",
              "backend/package.json",
              "backend/package-lock.json",
          }

          with tarfile.open(archive, "r:gz") as tar:
              for member in tar:
                  if member.name in (".", "./"):
                      continue

                  path = member.name.removeprefix("./").rstrip("/")

                  if member.issym() or member.islnk():
                      raise SystemExit(
                          f"ERROR: Archive contains link: {member.name}"
                      )

                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(
                          f"ERROR: Unsupported entry: {member.name}"
                      )

                  if not (
                      path in allowed_paths
                      or any(
                          path.startswith(prefix)
                          for prefix in allowed_prefixes
                      )
                  ):
                      raise SystemExit(
                          f"ERROR: Unexpected entry: {member.name}"
                      )

          print("Release archive entries validated.")
          PY

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tml-release
          path: |
            ${{ github.sha }}.tar.gz
            ${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  stage-production:
    name: Stage release on EC2
    needs: build-and-upload
    if: ${{ github.ref == 'refs/heads/main' && inputs.deployment_mode == 'stage' }}
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: tml-release

      - name: Verify release checksum
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          cp "${RELEASE_SHA}.tar.gz" release.tar.gz

          sha256sum -c "${RELEASE_SHA}.tar.gz.sha256"

          rm release.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload or verify immutable release in S3
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BUCKET: ${{ vars.TML_RELEASE_BUCKET }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_BUCKET"
          PREFIX="releases/${RELEASE_SHA}"

          declare -A EXISTS

          for FILE in release.tar.gz release.tar.gz.sha256; do
            KEY="${PREFIX}/${FILE}"
            ERR_FILE="$(mktemp)"

            if aws s3api head-object \
              --bucket "$RELEASE_BUCKET" \
              --key "$KEY" \
              >/dev/null 2>"$ERR_FILE"; then

              EXISTS["$FILE"]=yes

            elif grep -Eq '\(404\)|Not Found|HeadObject.*404' "$ERR_FILE"; then

              EXISTS["$FILE"]=no

            else
              echo "ERROR: Unable to inspect S3 object: $KEY" >&2
              cat "$ERR_FILE" >&2
              rm -f "$ERR_FILE"
              exit 1
            fi

            rm -f "$ERR_FILE"
          done

          if [[ "${EXISTS[release.tar.gz]}" != \
                "${EXISTS[release.tar.gz.sha256]}" ]]; then

            echo "ERROR: Incomplete release in S3. Manual review required." >&2
            exit 1
          fi

          if [[ "${EXISTS[release.tar.gz]}" == yes ]]; then
            for FILE in release.tar.gz release.tar.gz.sha256; do
              KEY="${PREFIX}/${FILE}"
              LOCAL_FILE="$FILE"

              if [[ "$FILE" == "release.tar.gz" ]]; then
                LOCAL_FILE="${RELEASE_SHA}.tar.gz"
              else
                LOCAL_FILE="${RELEASE_SHA}.tar.gz.sha256"
              fi

              TEMP_FILE="$(mktemp)"

              aws s3api get-object \
                --bucket "$RELEASE_BUCKET" \
                --key "$KEY" \
                "$TEMP_FILE" >/dev/null

              if ! cmp -s "$LOCAL_FILE" "$TEMP_FILE"; then
                echo "ERROR: Existing S3 artifact differs: $KEY" >&2
                rm -f "$TEMP_FILE"
                exit 1
              fi

              rm -f "$TEMP_FILE"
              echo "Verified existing immutable artifact: $KEY"
            done

          else
            aws s3api put-object \
              --bucket "$RELEASE_BUCKET" \
              --key "${PREFIX}/release.tar.gz" \
              --body "${RELEASE_SHA}.tar.gz" \
              --if-none-match '*'

            aws s3api put-object \
              --bucket "$RELEASE_BUCKET" \
              --key "${PREFIX}/release.tar.gz.sha256" \
              --body "${RELEASE_SHA}.tar.gz.sha256" \
              --if-none-match '*'

            echo "Uploaded immutable release artifacts: $PREFIX"
          fi

      - name: Stage release using AWS Systems Manager
        env:
          RELEASE_SHA: ${{ github.sha }}
          EC2_INSTANCE_ID: i-09f60feed6b513d99
        run: |
          set -euo pipefail

          PARAMS="$(python3 - "$RELEASE_SHA" <<'PY'
          import json
          import sys

          sha = sys.argv[1]
          command = f"runuser -u ec2-user -- /home/ec2-user/deploy.sh '{sha}'"
          print(json.dumps({"commands": [command]}))
          PY
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "$PARAMS" \
              --query 'Command.CommandId' \
              --output text
          )"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text
          )"

          if [[ "$STATUS" != "Success" ]]; then
            echo "ERROR: EC2 release staging failed: $STATUS"
            exit 1
          fi

          echo "EC2 release staging completed successfully."

      - name: Validate activation script without activating
        env:
          RELEASE_SHA: ${{ github.sha }}
          EC2_INSTANCE_ID: i-09f60feed6b513d99
        run: |
          set -euo pipefail

          PARAMS="$(python3 - "$RELEASE_SHA" <<'PY'
          import json
          import sys

          sha = sys.argv[1]
          command = (
              "runuser -u ec2-user -- "
              f"/home/ec2-user/activate-backend.sh '{sha}' --dry-run"
          )
          print(json.dumps({"commands": [command]}))
          PY
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "$PARAMS" \
              --query 'Command.CommandId' \
              --output text
          )"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text
          )"

          if [[ "$STATUS" != "Success" ]]; then
            echo "ERROR: Activation dry-run failed: $STATUS"
            exit 1
          fi

          echo "Activation dry-run completed successfully."

      - name: Publish frontend release without activating
        env:
          RELEASE_SHA: ${{ github.sha }}
          EC2_INSTANCE_ID: i-09f60feed6b513d99
        run: |
          set -euo pipefail

          PARAMS="$(python3 - "$RELEASE_SHA" <<'PYCODE'
          import json
          import sys

          sha = sys.argv[1]
          command = f"sudo /home/ec2-user/publish-frontend.sh '{sha}'"
          print(json.dumps({"commands": [command]}))
          PYCODE
          )"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)"

          [[ "$STATUS" == "Success" ]] || exit 1

      - name: Dry-run frontend activation
        env:
          RELEASE_SHA: ${{ github.sha }}
          EC2_INSTANCE_ID: i-09f60feed6b513d99
        run: |
          set -euo pipefail

          PARAMS="$(python3 - "$RELEASE_SHA" <<'PYCODE'
          import json
          import sys

          sha = sys.argv[1]
          command = f"sudo /home/ec2-user/activate-frontend.sh '{sha}' --dry-run"
          print(json.dumps({"commands": [command]}))
          PYCODE
          )"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)"

          [[ "$STATUS" == "Success" ]] || exit 1

  activate-production:
    name: Activate production release
    needs:
      - build-and-upload
      - stage-production

    # Allow activation-only runs when staging jobs are skipped.
    # Never activate after a failed or cancelled staging job.
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        inputs.deployment_mode == 'activate' &&
        needs.build-and-upload.result == 'skipped' &&
        needs.stage-production.result == 'skipped'
      }}

    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Validate activation conditions
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_SHA: ${{ inputs.approved_sha }}
          ACTIVATION_ENABLED: ${{ vars.TML_ENABLE_PRODUCTION_ACTIVATION }}
        run: |
          set -euo pipefail

          if [[ "$ACTIVATION_ENABLED" != "true" ]]; then
            echo "ERROR: Production activation is not enabled."
            exit 1
          fi

          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid approved commit SHA."
            exit 1
          fi

          if [[ "$APPROVED_SHA" != "a2f54588484ba772aa9ca8be286116c9484f39c6" ]]; then
            echo "ERROR: This activation is authorized only for the previously staged release."
            exit 1
          fi

          if [[ "$(TZ=Asia/Taipei date +%u)" != "5" ]]; then
            echo "ERROR: Production activation is permitted only on Friday in Taiwan."
            exit 1
          fi

      - name: Verify staged backend and frontend releases
        env:
          RELEASE_SHA: ${{ inputs.approved_sha }}
          EC2_INSTANCE_ID: i-09f60feed6b513d99
        run: |
          set -euo pipefail

          PARAMS="$(python3 - "$RELEASE_SHA" <<'PYCODE'
          import json
          import sys

          sha = sys.argv[1]

          command = (
              f"test -d /home/ec2-user/tml-releases/releases/{sha} && "
              f"test -f /home/ec2-user/tml-releases/releases/{sha}/backend/dist/main.js && "
              f"test -d /var/www/tml-releases/releases/{sha} && "
              f"test -f /var/www/tml-releases/releases/{sha}/index.html && "
              f"echo 'Both staged releases verified: {sha}'"
          )

          print(json.dumps({"commands": [command]}))
          PYCODE
          )"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status \
            --output text)"

          [[ "$STATUS" == "Success" ]] || {
            echo "ERROR: Staged release verification failed."
            exit 1
          }

          echo "Backend and frontend releases are ready for activation."

      - name: Activate approved backend release
        env:
          RELEASE_SHA: ${{ inputs.approved_sha }}
          EC2_INSTANCE_ID: i-09f60feed6b513d99
        run: |
          set -euo pipefail

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "commands=[\"runuser -u ec2-user -- env TML_APPROVED_DEPLOYMENT=YES /home/ec2-user/activate-backend.sh ${RELEASE_SHA}\"]" \
              --query 'Command.CommandId' \
              --output text
          )"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status \
            --output text)"

          if [[ "$STATUS" != "Success" ]]; then
            echo "ERROR: Backend activation failed. SSM status: $STATUS"
            exit 1
          fi

          echo "Backend activation completed successfully."

      - name: Activate approved frontend release
        env:
          RELEASE_SHA: ${{ inputs.approved_sha }}
          EC2_INSTANCE_ID: i-09f60feed6b513d99
        run: |
          set -euo pipefail

          PARAMS="$(python3 - "$RELEASE_SHA" <<'PYCODE'
          import json
          import sys

          sha = sys.argv[1]
          command = (
              "sudo env TML_APPROVED_DEPLOYMENT=YES "
              f"/home/ec2-user/activate-frontend.sh '{sha}' --activate"
          )
          print(json.dumps({"commands": [command]}))
          PYCODE
          )"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)"

          [[ "$STATUS" == "Success" ]] || exit 1

      - name: Verify activated release
        env:
          RELEASE_SHA: ${{ inputs.approved_sha }}
          EC2_INSTANCE_ID: i-09f60feed6b513d99
        run: |
          set -euo pipefail

          EXPECTED_PATH="/home/ec2-user/tml-releases/releases/${RELEASE_SHA}"

          COMMANDS="$(
            jq -nc \
              --arg expected "$EXPECTED_PATH" \
              '{
                commands: [
                  "set -eu",
                  "ACTUAL_PATH=$(readlink -f /home/ec2-user/tml-releases/current)",
                  ("test \"$ACTUAL_PATH\" = " + ($expected | @sh)),
                  "curl -fsS --max-time 10 http://127.0.0.1:3000/crm/companies >/dev/null"
                ]
              }'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "$COMMANDS" \
              --query 'Command.CommandId' \
              --output text
          )"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

  verify-production:
    name: Verify production release
    if: ${{ github.ref == 'refs/heads/main' && inputs.deployment_mode == 'verify' }}
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Verify deployed backend and frontend
        env:
          RELEASE_SHA: ${{ inputs.approved_sha }}
          EC2_INSTANCE_ID: i-09f60feed6b513d99
        run: |
          set -euo pipefail

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: Invalid release SHA."
            exit 1
          }

          COMMANDS="$(
            jq -nc \
              --arg sha "$RELEASE_SHA" \
              '{
                commands: [
                  "set -eu",
                  ("test \"$(readlink -f /home/ec2-user/tml-releases/current)\" = \"/home/ec2-user/tml-releases/releases/" + $sha + "\""),
                  ("test \"$(readlink -f /var/www/tml-releases/current)\" = \"/var/www/tml-releases/releases/" + $sha + "\""),
                  "curl -fsS --max-time 10 http://127.0.0.1:3000/crm/companies >/dev/null",
                  "curl -fsS --max-time 10 http://127.0.0.1/ >/dev/null"
                ]
              }'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "$COMMANDS" \
              --query 'Command.CommandId' \
              --output text
          )"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID"

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"