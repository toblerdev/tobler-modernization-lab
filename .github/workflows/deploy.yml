
name: TML Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tml-production-deployment
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and Upload Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ==========================================
      # Build and test NestJS backend
      # ==========================================

      - name: Set up backend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build and test backend
        working-directory: backend
        run: |
          npm ci
          npm test -- --runInBand
          npm run build

      - name: Prepare backend runtime dependencies
        working-directory: backend
        run: npm prune --omit=dev

      # ==========================================
      # Build React frontend
      # ==========================================

      - name: Set up frontend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ==========================================
      # Package and validate release artifacts
      # ==========================================

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/backend release/frontend

          cp -a backend/dist release/backend/
          cp -a backend/node_modules release/backend/
          cp -a frontend/dist release/frontend/

          # Remove npm executable links from the copied
          # release package, not the original dependencies.
          find release/backend/node_modules \
            -type d -name .bin -prune -exec rm -rf -- {} +

          # Reject any remaining symbolic links.
          if find release -type l -print -quit | grep -q .; then
            echo "ERROR: Release contains unexpected symlinks." >&2
            exit 1
          fi

          # Verify required application files.
          test -f release/backend/dist/main.js
          test -f release/frontend/dist/index.html
          test -d release/backend/node_modules

          # Create release archive.
          tar -czf release.tar.gz -C release .

          # Generate SHA-256 checksum.
          sha256sum release.tar.gz > release.tar.gz.sha256

          echo "Release commit: $GITHUB_SHA"
          echo "Release size:"
          du -h release.tar.gz

      # ==========================================
      # Authenticate with AWS using OIDC
      # ==========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      # ==========================================
      # Upload immutable artifacts to private S3
      # ==========================================

      - name: Upload release artifacts to S3
        shell: bash
        env:
          BUCKET: tml-deployment-artifacts-779400169960-us-east-2-an
        run: |
          set -euo pipefail

          PREFIX="releases/$GITHUB_SHA"

          aws s3api put-object \
            --bucket "$BUCKET" \
            --key "$PREFIX/release.tar.gz" \
            --body release.tar.gz \
            --if-none-match '*'

          aws s3api put-object \
            --bucket "$BUCKET" \
            --key "$PREFIX/release.tar.gz.sha256" \
            --body release.tar.gz.sha256 \
            --if-none-match '*'

          echo "Release uploaded to:"
          echo "s3://$BUCKET/$PREFIX/"

      # ==========================================
      # Production deployment safety gate
      # ==========================================

      - name: Deployment execution disabled
        run: |
          echo "Release artifact uploaded successfully."
          echo "No EC2 deployment will be performed."
          echo "SSM deployment remains disabled pending integration testing."
