
name: TML Publish Test Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tml-test-artifact-publishing
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and Upload Test Artifact
    if: github.ref == 'refs/heads/feature/TML-1-automated-deployment'
    runs-on: ubuntu-latest
    environment: testing

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up backend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build and test backend
        working-directory: backend
        run: |
          npm ci
          npm test -- --runInBand
          npm run build

      - name: Prepare backend runtime dependencies
        working-directory: backend
        run: npm prune --omit=dev

      - name: Set up frontend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package test release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/backend release/frontend

          cp -a backend/dist release/backend/
          cp -a backend/node_modules release/backend/
          cp -a frontend/dist release/frontend/

          find release/backend/node_modules \
            -type d -name .bin -prune -exec rm -rf -- {} +

          if find release -type l -print -quit | grep -q .; then
            echo "ERROR: Release contains unexpected symlinks." >&2
            exit 1
          fi

          test -f release/backend/dist/main.js
          test -f release/frontend/dist/index.html
          test -d release/backend/node_modules

          tar -czf release.tar.gz -C release .
          sha256sum release.tar.gz > release.tar.gz.sha256

          echo "Test release commit: $GITHUB_SHA"
          du -h release.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TEST_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Upload test release to S3
        shell: bash
        env:
          BUCKET: tml-deployment-artifacts-779400169960-us-east-2-an
        run: |
          set -euo pipefail

          PREFIX="releases/$GITHUB_SHA"

          aws s3api put-object \
            --bucket "$BUCKET" \
            --key "$PREFIX/release.tar.gz" \
            --body release.tar.gz \
            --if-none-match '*'

          aws s3api put-object \
            --bucket "$BUCKET" \
            --key "$PREFIX/release.tar.gz.sha256" \
            --body release.tar.gz.sha256 \
            --if-none-match '*'

          echo "Test artifact uploaded:"
          echo "s3://$BUCKET/$PREFIX/"

      - name: Confirm deployment is disabled
        run: |
          echo "Artifact publishing complete."
          echo "No EC2 deployment or activation was performed."

