server {
    listen 80;
    listen [::]:80;

    server_name toblermodernizationlab.com www.toblermodernizationlab.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name toblermodernizationlab.com www.toblermodernizationlab.com;

    ssl_certificate /etc/nginx/ssl/tml-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/tml-origin.key;

    root /var/www/tml;
    index index.html;

    # NestJS CRM API
    location /crm/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NestJS Recommendations API
    location /recommendations/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
